services:
  encryption-aesgcm:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: encryption-aesgcm
      ENCRYPTION_GRPC_ADDR: "127.0.0.1:9601"
      ENCRYPTION_KEY_FILE: /var/lib/encryption-aesgcm/master.key
      ENCRYPTION_MASTER_KEY: ""
    volumes:
      - encryption-keys:/var/lib/encryption-aesgcm

volumes:
  encryption-keys:
