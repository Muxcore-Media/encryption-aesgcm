name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          repository: Muxcore-Media/core
      - uses: actions/checkout@v4
        with:
          path: encryption-aesgcm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./encryption-aesgcm
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          repository: Muxcore-Media/core
      - uses: actions/checkout@v4
        with:
          path: encryption-aesgcm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./encryption-aesgcm
        run: go test -race -count=1 -timeout 60s ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          repository: Muxcore-Media/core
      - uses: actions/checkout@v4
        with:
          path: encryption-aesgcm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./encryption-aesgcm
        run: go build -o /dev/null ./cmd/module

  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          repository: Muxcore-Media/core
      - uses: actions/checkout@v4
        with:
          path: encryption-aesgcm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./encryption-aesgcm/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
